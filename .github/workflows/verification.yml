name: verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ICARUS_VERSION: "13.0"
  KLT_SPEC: klayout-tools==0.8.0

jobs:
  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Icarus Verilog
        id: icarus-cache
        uses: actions/cache@v4
        with:
          path: ~/icarus
          key: icarus-${{ env.ICARUS_VERSION }}-ubuntu-24.04
      - name: Build pinned Icarus Verilog
        if: steps.icarus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf gperf flex bison
          tag="v$(echo "$ICARUS_VERSION" | tr . _)"
          git clone --depth 1 --branch "$tag" https://github.com/steveicarus/iverilog.git /tmp/iverilog
          cd /tmp/iverilog
          sh autoconf.sh
          ./configure --prefix="$HOME/icarus"
          make -j2
          make install
      - name: Install Verilator
        run: sudo apt-get install -y --no-install-recommends verilator
      - name: Install pinned Python deps
        run: |
          echo "$HOME/icarus/bin" >> "$GITHUB_PATH"
          pip install -r verification/requirements.txt
      - name: Smoke test and negative control
        # runner exits 0 only if the good DUT passes AND the negative control fails
        run: python3 verification/runner.py verification/smoke
      - name: Assert negative control failed
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("verification/smoke/sim_build/result.json"))
          print(json.dumps(r["tools"]))
          nc = r["legs"]["negative_control"]
          assert nc["expected"] == "fail" and any(t["result"] == "fail" for t in nc["tests"]), "negative control did not fail"
          assert r["tools"]["icarus"] == "13.0", f"unexpected Icarus {r['tools']['icarus']}"
          PY
      - name: Stamped benches (item 9 cold start) with negative control
        # plain-Verilog benches from verification/common; exits 0 only if every
        # bench passes AND each negative control (broken DUT outside common/) fails
        run: python3 -I verification/runner.py --vvp verification/item9/benches.json
      - name: Assert item-9 results and negative controls
        run: |
          python3 -I - <<'PY'
          import json
          r = json.load(open("verification/item9/sim_build/result.json"))
          assert r["overall"] == "pass", "item-9 run failed"
          assert r["tools"]["icarus"] == "13.0", f"unexpected Icarus {r['tools']['icarus']}"
          assert r["runs"], "no bench ran"
          assert all(e["good"]["result"] == "pass" for e in r["runs"]), "a bench failed"
          ncs = [e["negative_control"] for e in r["runs"] if "negative_control" in e]
          assert ncs and all(n["expected"] == "fail" and n["result"] == "fail" and n.get("ok") is True and n.get("reason") != "compile error" for n in ncs), "negative control did not fail at simulation (passed, or failed to compile)"
          print(f"{len(r['runs'])} bench runs passed, {len(ncs)} negative controls failed as required, {len(r['excluded'])} excluded")
          PY
      - name: Item-9 inventory is current and covers every stamped bench
        run: python3 -I verification/item9/inventory.py --check
      - name: Item-9 attestation envelope still reproduces
        # klt pin: same PyPI release as manifests/run-signoff.sh
        run: |
          pip install uv
          uvx --quiet --from "$KLT_SPEC" klt --version
          uvx --quiet --from "$KLT_SPEC" klt signoff --attest 9 \
            --inventory verification/signoff/item9-inventory.json \
            --check verification/signoff/item9-testbenches.json --format json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-result
          path: verification/**/sim_build/result.json

  rtl-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get install -y --no-install-recommends verilator
      - name: Lint rtl/
        run: verification/lint_rtl.sh

  reuse-lock:
    # Guards vendored rtl/common and verification/common (ADR-0001, ADR-0002):
    # byte identity with the lock, and no unlisted vendored file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored files against reuse.lock.json
        run: python3 -I spec/check_reuse_lock.py
      - name: Negative control (a perturbed copy must fail)
        # The script resolves ROOT from its own location, so a copied tree is
        # checked independently of the checkout.
        run: |
          set -eu
          t="$(mktemp -d)"
          mkdir "$t/spec"
          cp spec/check_reuse_lock.py "$t/spec/"
          cp reuse.lock.json "$t/"
          cp -r rtl verification "$t/"
          f="$(python3 -I -c 'import json;print(json.load(open("reuse.lock.json"))["files"][0]["path"])')"
          python3 -I "$t/spec/check_reuse_lock.py"
          echo "// perturbed" >> "$t/$f"
          if python3 -I "$t/spec/check_reuse_lock.py"; then
            echo "negative control: perturbed vendored file was not caught"; exit 1
          fi
          rm "$t/$f"
          if python3 -I "$t/spec/check_reuse_lock.py"; then
            echo "negative control: missing vendored file was not caught"; exit 1
          fi
