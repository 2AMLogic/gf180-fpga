name: signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from manifests/gf180-fpga.json, re-run the item 10
# attestation, and byte-compare both against the committed copies. A manifest
# that cites a changed artifact makes the fresh render differ and this fails;
# whoever changes cited evidence regenerates the record in the same PR
# (manifests/run-signoff.sh). See manifests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Re-run klt signoff and compare against the committed record
        run: manifests/run-signoff.sh --check
